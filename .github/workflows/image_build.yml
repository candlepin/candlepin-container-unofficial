name: Build Candlepin Test Containers

on:
  workflow_dispatch:
    inputs:
      upstream-image:
        description: 'Upstream candlepin image to use as base'
        required: true
        default: 'quay.io/candlepin/candlepin:dev-latest'
        type: string
      httpd-image:
        description: 'Image of httpd'
        required: false
        default: 'quay.io/hummingbird/httpd:latest'
        type: string
      candlepin-ref:
        description: 'Candlepin git ref (for test data scripts only)'
        required: true
        default: 'main'
        type: string
      tag:
        description: "Image tag (default: derived from the upstream image version)"
        required: false
        default: ""
        type: string
      push-image:
        description: 'Push images to ghcr.io'
        required: false
        default: true
        type: boolean
      update-latest:
        description: "Update 'latest' tag"
        required: false
        default: true
        type: boolean

run-name: >
  ${{ format('Build ({0}, push: {1}, latest: {2})',
  inputs.upstream-image || 'quay.io/candlepin/candlepin:dev-latest',
  inputs.push-image && 'Y' || 'N',
  inputs.update-latest && 'Y' || 'N') }}

jobs:
  build:
    name: "Build split containers"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        if: inputs.push-image
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and test / push) all containers
        run: |
          ./build.sh \
            --upstream-image "${{ inputs.upstream-image || 'quay.io/candlepin/candlepin:dev-latest' }}" \
            --httpd-image "${{ inputs.httpd-image || 'quay.io/hummingbird/httpd:latest' }}" \
            --candlepin-ref "${{ inputs.candlepin-ref || 'main' }}" \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --no-pod \
            ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }} \
            ${{ inputs.update-latest && '' || '--no-latest' }} \
            ${{ inputs.push-image && '--push' || '' }}

      - name: Summary
        run: |
          echo "### Split Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images built for base \`${{ inputs.upstream-image || 'quay.io/candlepin/candlepin:dev-latest' }}\`:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository_owner }}/candlepin-app" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository_owner }}/candlepin-repo" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository_owner }}/candlepin-db" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pushed: ${{ inputs.push-image && 'yes' || 'no' }}" >> $GITHUB_STEP_SUMMARY
