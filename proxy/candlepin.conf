# candlepin-proxy — nginx reverse proxy that terminates client TLS in front of
# candlepin-app, mirroring how Candlepin is typically fronted by a web server in
# production. Installed as a drop-in into /etc/nginx/conf.d/ on top of the stock
# Hummingbird nginx image, which runs unprivileged (uid 65532).
#
# Why this exists: candlepin-app offers both an ML-DSA (post-quantum) and an RSA
# TLS server certificate. Go 1.27+ clients advertise ML-DSA in the TLS 1.3
# signature_algorithms extension but omit it from signature_algorithms_cert, so
# when Tomcat's OpenSSL provider selects the ML-DSA certificate the handshake
# fails ("no suitable signature algorithm"). This proxy terminates TLS with a
# plain RSA certificate, so those clients connect successfully, then forwards the
# request to candlepin-app over plain HTTP (port 8080).
#
# Mutual TLS is preserved: nginx verifies the consumer/entitlement client
# certificate against candlepin's CA bundle and forwards it to Tomcat via the
# ssl_client_escaped_cert header. Tomcat's SSLValve (configured in the app's
# server.xml) turns that back into the servlet X509 attribute candlepin reads.

server {
    listen 8443 ssl;
    server_name candlepin;

    # TLS termination with an RSA certificate only (no ML-DSA). This is the
    # candlepin-app RSA "Server CA" cert, which carries SAN DNS:candlepin and
    # validates against candlepin-ca-bundle.crt.
    ssl_certificate     /etc/nginx/certs/candlepin-rsa-ca.crt;
    ssl_certificate_key /etc/nginx/certs/candlepin-rsa-ca.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Request and verify the client (consumer/entitlement) certificate so
    # candlepin's mutual-TLS authentication keeps working through the proxy.
    # "optional" allows unauthenticated endpoints (status, registration via
    # basic auth) while still validating any presented client certificate.
    ssl_client_certificate /etc/nginx/certs/candlepin-ca-bundle.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       3;

    # Keep large registration/entitlement payloads flowing.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Forward the verified client certificate to Tomcat's SSLValve, which
        # reads the URL-encoded PEM from this header and decodes it.
        proxy_set_header ssl_client_escaped_cert $ssl_client_escaped_cert;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }
}
